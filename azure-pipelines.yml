trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  BuildConfiguration: Release

stages:
  - stage: CI
    displayName: 'CI — Build & Pack'
    jobs:
      - job: Build
        displayName: 'Restore, Build, Pack'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET 10 SDK'
            inputs:
              packageType: sdk
              version: '10.0.x'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate NuGet'

          - script: |
              set -euo pipefail
              dotnet restore crumbs-stock.sln
            displayName: 'Restore'

          - script: |
              dotnet build crumbs-stock.sln -c $(BuildConfiguration) --no-restore
            displayName: 'Build'

          - script: |
              set -euo pipefail
              VERSION="0.1.$(Build.BuildId)-ci"
              dotnet pack crumbs.stock/crumbs.stock.csproj \
                -c $(BuildConfiguration) \
                --no-build \
                -p:PackageVersion="$VERSION" \
                -o $(Build.ArtifactStagingDirectory)
            displayName: 'Pack'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'nuget-packages'

  - stage: CD
    displayName: 'CD — Publish to Feed'
    dependsOn: CI
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - deployment: Publish
        displayName: 'Build and publish release package'
        variables:
          - name: packageMajorMinor
            value: '1.2'
          - name: packagePatch
            value: $[counter(variables['packageMajorMinor'], 2)]
        environment: 'crumbs-packages'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: none

                - task: UseDotNet@2
                  displayName: 'Use .NET 10 SDK'
                  inputs:
                    packageType: sdk
                    version: '10.0.x'

                - task: NuGetAuthenticate@1
                  displayName: 'Authenticate NuGet'

                - script: |
                    set -euo pipefail
                    VERSION="$(packageMajorMinor).$(packagePatch)"
                    echo "##vso[task.setvariable variable=ResolvedPackageVersion]$VERSION"
                  displayName: 'Resolve package version'

                - script: |
                    set -euo pipefail
                    dotnet restore crumbs-stock.sln
                  displayName: 'Restore release package'

                - script: |
                    dotnet build crumbs-stock.sln -c $(BuildConfiguration) --no-restore
                  displayName: 'Build release package'

                - script: |
                    set -euo pipefail
                    OUT_DIR="$(Build.ArtifactStagingDirectory)/release-packages"
                    mkdir -p "$OUT_DIR"
                    dotnet pack crumbs.stock/crumbs.stock.csproj \
                      -c $(BuildConfiguration) \
                      --no-build \
                      -p:PackageVersion="$(ResolvedPackageVersion)" \
                      -o "$OUT_DIR"
                  displayName: 'Pack release package'

                - script: |
                    set -euo pipefail
                    FEED_URL="https://pkgs.dev.azure.com/crumbssoft/crumbs/_packaging/crumbs-private/nuget/v3/index.json"
                    shopt -s nullglob
                    packages=("$(Build.ArtifactStagingDirectory)/release-packages"/*.nupkg)
                    if [ ${#packages[@]} -eq 0 ]; then
                      echo "No NuGet packages found to publish."
                      exit 1
                    fi
                    for pkg in "${packages[@]}"; do
                      dotnet nuget push "$pkg" \
                        --source "$FEED_URL" \
                        --api-key AzureArtifacts \
                        --skip-duplicate
                    done
                  displayName: 'Push to crumbs-private'
